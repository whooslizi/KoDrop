name: Release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # PUC Lua 5.1 can't yield across pcall; KOReader runs LuaJIT
      - name: Self-check
        run: |
          sudo apt-get install -y -qq luajit
          luajit spec/kodrop_spec.lua

      - name: Package
        run: |
          sed -i "s/version = \"dev\"/version = \"$VERSION\"/" kodrop.koplugin/_meta.lua
          grep -q "version = \"$VERSION\"" kodrop.koplugin/_meta.lua
          zip -r kodrop.koplugin.zip kodrop.koplugin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" kodrop.koplugin.zip \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
