name: Release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PUC Lua 5.1 can't yield across pcall; KOReader runs LuaJIT
      - name: Self-check
        run: |
          sudo apt-get install -y -qq luajit
          luajit spec/kodrop_spec.lua

      - name: Package
        run: zip -r kodrop.koplugin.zip kodrop.koplugin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v1.0.${{ github.run_number }}
        run: |
          gh release create "$VERSION" kodrop.koplugin.zip \
            --title "KoDrop $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
